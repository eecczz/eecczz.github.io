# Essentially Minimal theme but with constant home section bg color.
name = "Seonwoo Engineering Portfolio"

[light]
  # Primary
  primary = "#00a7c4"
  
  # Menu
  menu_primary = "rgb(247, 250, 252)"
  menu_text = "#243b53"
  menu_text_active = "#0089a2"
  menu_title = "#102a43"

  # Home sections
  home_section_odd = "#f7fafc"
  home_section_even = "#eef6f8"

[dark]
  primary = "#36c6dc"
  link = "#72e2f0"
  link_hover = "#bdeff5"
  background = "#0b1f33"
  home_section_odd = "#0b1f33"
  home_section_even = "#102a43"
  menu_primary = "#0b1f33"
  menu_text = "#edf7fa"
  menu_text_active = "#36c6dc"
