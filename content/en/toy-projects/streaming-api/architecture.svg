<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Streaming API System Flow</title>
  <desc id="desc">Browser uploads video through Spring Boot to AWS processing services and plays the generated HLS stream.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#00a7c4"/></marker></defs>
  <rect width="1200" height="430" rx="16" fill="#f5fbfc"/>
  <text x="60" y="68" fill="#0d3857" font-family="Arial, sans-serif" font-size="30" font-weight="700">Streaming API · System Flow</text>
  <text x="60" y="104" fill="#537083" font-family="Arial, sans-serif" font-size="18">Keep upload, media conversion, post metadata and playback responsibilities separated.</text>
  <g font-family="Arial, sans-serif">
    <g><rect x="50" y="178" width="178" height="116" rx="14" fill="#103653"/><text x="139" y="225" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">Web Client</text><text x="139" y="256" text-anchor="middle" fill="#bfe9ef" font-size="16">Upload · browse · play</text></g>
    <g><rect x="278" y="178" width="178" height="116" rx="14" fill="#e6f6f8" stroke="#00a7c4" stroke-width="2"/><text x="367" y="221" text-anchor="middle" fill="#103653" font-size="20" font-weight="700">Spring Boot</text><text x="367" y="253" text-anchor="middle" fill="#42697d" font-size="16">REST API &amp; metadata</text></g>
    <g><rect x="506" y="178" width="178" height="116" rx="14" fill="#e6f6f8" stroke="#00a7c4" stroke-width="2"/><text x="595" y="220" text-anchor="middle" fill="#103653" font-size="21" font-weight="700">Amazon S3</text><text x="595" y="253" text-anchor="middle" fill="#42697d" font-size="16">Raw video storage</text></g>
    <g><rect x="734" y="178" width="178" height="116" rx="14" fill="#e6f6f8" stroke="#00a7c4" stroke-width="2"/><text x="823" y="217" text-anchor="middle" fill="#103653" font-size="18" font-weight="700">Lambda +</text><text x="823" y="242" text-anchor="middle" fill="#103653" font-size="18" font-weight="700">MediaConvert</text><text x="823" y="268" text-anchor="middle" fill="#42697d" font-size="15">HLS conversion</text></g>
    <g><rect x="962" y="178" width="188" height="116" rx="14" fill="#0b869d"/><text x="1056" y="221" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">HLS Playback</text><text x="1056" y="253" text-anchor="middle" fill="#d6f7fb" font-size="16">Manifest + segments</text></g>
  </g>
  <g stroke="#00a7c4" stroke-width="3" marker-end="url(#arrow)"><path d="M229 236H272"/><path d="M457 236H500"/><path d="M685 236H728"/><path d="M913 236H956"/></g>
  <rect x="50" y="340" width="1100" height="48" rx="10" fill="#d9f0f3"/><text x="600" y="371" text-anchor="middle" fill="#20556d" font-family="Arial, sans-serif" font-size="18">The post stores title, author and video URL; the viewer requests only the playback URL it needs.</text>
</svg>
