<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700">
  <defs>
    <style>
      .ui { font-family: Inter, Pretendard, "Noto Sans KR", sans-serif; }
      .code { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; font-size: 19px; }
      .ln { fill: #66707b; text-anchor: end; }
      .tx { fill: #d7dae0; }
      .kw { fill: #c586c0; }
      .st { fill: #ce9178; }
      .fn { fill: #dcdcaa; }
    </style>
  </defs>
  <rect width="1280" height="700" rx="14" fill="#181a1f"/>
  <rect width="1280" height="54" rx="14" fill="#22252b"/>
  <rect y="42" width="1280" height="12" fill="#22252b"/>
  <circle cx="27" cy="27" r="7" fill="#ff5f57"/><circle cx="50" cy="27" r="7" fill="#febc2e"/><circle cx="73" cy="27" r="7" fill="#28c840"/>
  <text x="104" y="34" class="ui" font-size="18" fill="#c7cbd1">build.gradle · Querydsl generated source configuration</text>

  <rect x="24" y="76" width="1232" height="200" rx="8" fill="#1e2026" stroke="#343842"/>
  <rect x="24" y="76" width="1232" height="38" rx="8" fill="#282c34"/>
  <rect x="24" y="104" width="1232" height="10" fill="#282c34"/>
  <text x="44" y="102" class="ui" font-size="16" font-weight="700" fill="#f08c86">BEFORE · Legacy plugin and split generation path</text>
  <g class="code">
    <text x="74" y="150" class="ln">5</text><text x="94" y="150" class="tx"><tspan class="kw">id</tspan> <tspan class="st">"com.ewerk.gradle.plugins.querydsl"</tspan> version <tspan class="st">"1.0.10"</tspan></text>
    <text x="74" y="181" class="ln">52</text><text x="94" y="181" class="tx"><tspan class="kw">def</tspan> querydslDir = <tspan class="st">"$buildDir/generated/querydsl"</tspan></text>
    <text x="74" y="212" class="ln">53</text><text x="94" y="212" class="tx">querydsl {</text>
    <text x="74" y="243" class="ln">54</text><text x="126" y="243" class="tx">jpa = <tspan class="kw">true</tspan>; querydslSourcesDir = querydslDir</text>
  </g>

  <text x="640" y="309" text-anchor="middle" class="ui" font-size="16" fill="#8f98a5">Remove plugin · Use Jakarta APT · Keep one generated source directory</text>
  <path d="M608 325h64l-32 22z" fill="#22b8cf"/>

  <rect x="24" y="362" width="1232" height="310" rx="8" fill="#1e2026" stroke="#343842"/>
  <rect x="24" y="362" width="1232" height="38" rx="8" fill="#282c34"/>
  <rect x="24" y="390" width="1232" height="10" fill="#282c34"/>
  <text x="44" y="388" class="ui" font-size="16" font-weight="700" fill="#64d8cb">AFTER · Jakarta APT and one generated source</text>
  <rect x="88" y="411" width="1144" height="78" rx="5" fill="#12343d" opacity="0.7"/>
  <g class="code">
    <text x="74" y="441" class="ln">31</text><text x="94" y="441" class="tx">implementation <tspan class="st">'com.querydsl:querydsl-jpa:5.0.0:jakarta'</tspan></text>
    <text x="74" y="472" class="ln">32</text><text x="94" y="472" class="tx">annotationProcessor <tspan class="st">"com.querydsl:querydsl-apt:5.0.0:jakarta"</tspan></text>
    <text x="74" y="513" class="ln">46</text><text x="94" y="513" class="tx"><tspan class="kw">def</tspan> querydslDir = <tspan class="st">"$buildDir/generated/querydsl"</tspan></text>
    <text x="74" y="544" class="ln">47</text><text x="94" y="544" class="tx">sourceSets { main.java.srcDir(querydslDir) }</text>
    <text x="74" y="575" class="ln">48</text><text x="94" y="575" class="tx">tasks.<tspan class="fn">withType</tspan>(JavaCompile).configureEach {</text>
    <text x="74" y="606" class="ln">49</text><text x="126" y="606" class="tx">options.generatedSourceOutputDirectory = <tspan class="fn">file</tspan>(querydslDir)</text>
    <text x="74" y="637" class="ln">50</text><text x="94" y="637" class="tx">}</text>
    <text x="74" y="660" class="ln">51</text><text x="94" y="660" class="tx">clean { delete <tspan class="fn">file</tspan>(querydslDir) }</text>
  </g>
</svg>
