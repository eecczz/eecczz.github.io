    <text x="74" y="671" class="ln">36166</text><text x="94" y="671" class="tx">RotationDrive:  Spring: <tspan class="num">1000</tspan>  Damper: <tspan class="num">50</tspan></text>
    <text x="74" y="712" class="ln">36174</text><text x="94" y="712" class="tx">Target: {fileID: 99810556013693266}</text>
