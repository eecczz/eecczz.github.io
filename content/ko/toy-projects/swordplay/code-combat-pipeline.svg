  <circle cx="27" cy="27" r="7" fill="#ff5f57"/><circle cx="50" cy="27" r="7" fill="#febc2e"/><circle cx="73" cy="27" r="7" fill="#28c840"/>
  <text x="104" y="34" class="ui" font-size="18" fill="#c7cbd1">Swordplay · focused implementation evidence</text>

  <rect x="24" y="76" width="1232" height="190" rx="8" fill="#1e2026" stroke="#343842"/>
  <rect x="24" y="76" width="1232" height="38" rx="8" fill="#282c34"/>
  <rect x="24" y="104" width="1232" height="10" fill="#282c34"/>
  <text x="44" y="102" class="ui" font-size="16" font-weight="700" fill="#8ecae6">PlayerWorker.cs · mouse direction → attack Blend Tree</text>
  <rect x="88" y="128" width="1144" height="65" rx="5" fill="#13384a" opacity="0.72"/>
  <g class="code">
    <text x="74" y="154" class="ln">196</text><text x="94" y="154" class="tx"><tspan class="kw">if</tspan> (swing == <tspan class="num">0</tspan> &amp;&amp; !anim.GetCurrentAnimatorStateInfo(<tspan class="num">0</tspan>).IsName(<tspan class="st">"Attack"</tspan>)) {</text>
    <text x="74" y="185" class="ln">198</text><text x="126" y="185" class="tx">anim.<tspan class="fn">SetFloat</tspan>(<tspan class="st">"tx"</tspan>, tx);  anim.<tspan class="fn">SetFloat</tspan>(<tspan class="st">"ty"</tspan>, ty);</text>
    <text x="74" y="216" class="ln">199</text><text x="94" y="216" class="tx">}</text>
    <text x="74" y="247" class="ln">201</text><text x="94" y="247" class="tx">tx += Input.<tspan class="fn">GetAxis</tspan>(<tspan class="st">"Mouse X"</tspan>) * sensitivity;</text>
  </g>

  <rect x="24" y="288" width="1232" height="250" rx="8" fill="#1e2026" stroke="#343842"/>
  <rect x="24" y="288" width="1232" height="38" rx="8" fill="#282c34"/>
  <rect x="24" y="316" width="1232" height="10" fill="#282c34"/>
  <text x="44" y="314" class="ui" font-size="16" font-weight="700" fill="#8ecae6">PlayerWorker.cs · contact point → reaction Blend Tree</text>
  <rect x="88" y="341" width="1144" height="127" rx="5" fill="#4a2730" opacity="0.64"/>
  <g class="code">
    <text x="74" y="368" class="ln">426</text><text x="94" y="368" class="tx"><tspan class="ty">Vector3</tspan> hitpoint = Quaternion.<tspan class="fn">Euler</tspan>(<tspan class="kw">new</tspan> Vector3(<tspan class="num">0</tspan>, -transform.rotation.eulerAngles.y, <tspan class="num">0</tspan>))</text>
    <text x="74" y="399" class="ln"></text><text x="286" y="399" class="tx">* (collision.contacts[<tspan class="num">0</tspan>].point - (transform.position + Vector3.up));</text>
    <text x="74" y="440" class="ln">427</text><text x="94" y="440" class="tx">anim.<tspan class="fn">SetFloat</tspan>(<tspan class="st">"cx"</tspan>, Mathf.<tspan class="fn">Clamp</tspan>(hitpoint.x, -<tspan class="num">1</tspan>, <tspan class="num">1</tspan>));</text>
    <text x="74" y="471" class="ln">428</text><text x="94" y="471" class="tx">anim.<tspan class="fn">SetFloat</tspan>(<tspan class="st">"cy"</tspan>, Mathf.<tspan class="fn">Clamp</tspan>(hitpoint.y, <tspan class="num">0</tspan>, <tspan class="num">1</tspan>));</text>
  </g>

  <rect x="24" y="560" width="1232" height="172" rx="8" fill="#1e2026" stroke="#343842"/>
  <rect x="24" y="560" width="1232" height="38" rx="8" fill="#282c34"/>
