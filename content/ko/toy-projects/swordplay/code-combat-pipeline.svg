<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs>
    <style>
      .ui { font-family: Inter, "Segoe UI", sans-serif; }
      .code { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; font-size: 17px; }
