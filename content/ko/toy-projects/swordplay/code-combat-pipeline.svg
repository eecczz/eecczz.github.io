      .tx { fill: #d7dae0; }
      .kw { fill: #c586c0; }
      .st { fill: #ce9178; }
      .fn { fill: #dcdcaa; }
      .ty { fill: #4ec9b0; }
      .num { fill: #b5cea8; }
    </style>
  </defs>
  <rect width="1280" height="760" rx="14" fill="#181a1f"/>
